name: CI
on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and test (${{ matrix.host }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: net10
            archive: dnSpy-net-win64.zip
            sha256: 8ed48f165dc355e869f3a0037ad4f9216147f995a5ae0258b296eeef1f73aab0
          - host: net48
            archive: dnSpy-netframework.zip
            sha256: 2eadb7f4931ad1882d10477cf57185d288cacc6e3abf9958e7ae73c0a0f31dd1
    env:
      CI_DOTNET_VERSION: '10.0.402'
      CI_DNSPY_VERSION: 'v6.6.0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check PowerShell syntax
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem ./scripts -Filter '*.ps1' -File) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count) {
                  throw "$($file.Name): $($errors -join '; ')"
              }
          }
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.CI_DOTNET_VERSION }}
      - name: Select SDK and verify release version
        run: |
          $ErrorActionPreference = 'Stop'
          @{
              sdk = @{
                  version = $env:CI_DOTNET_VERSION
                  rollForward = 'disable'
                  allowPrerelease = $false
              }
          } |
              ConvertTo-Json -Depth 3 | Set-Content ./global.json -Encoding utf8
          dotnet --version
          if ($LASTEXITCODE -ne 0) {
              throw 'SDK selection failed.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              if ($env:GITHUB_REF_NAME -cnotmatch '\Av(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z') {
                  throw 'Expected vX.Y.Z.'
              }
              foreach ($name in @('Extension', 'Protocol', 'Logging', 'Server')) {
                  $version = & dotnet msbuild "./src/dnSpy.MCP.$name/dnSpy.MCP.$name.csproj" -nologo -getProperty:Version
                  if ($LASTEXITCODE -ne 0 -or ($version -join "`n").Trim() -cne $env:GITHUB_REF_NAME.Substring(1)) {
                      throw "Version mismatch: $name"
                  }
              }
          }
      - name: Download and verify host
        env:
          HOST_ARCHIVE: ${{ matrix.archive }}
          HOST_SHA256: ${{ matrix.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP $env:HOST_ARCHIVE
          $root = Join-Path $env:RUNNER_TEMP 'dnspy-host'
          Invoke-WebRequest "https://github.com/dnSpyEx/dnSpy/releases/download/$env:CI_DNSPY_VERSION/$env:HOST_ARCHIVE" -OutFile $zip -TimeoutSec 180
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ine $env:HOST_SHA256) {
              throw 'Host archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $root
          "CI_DNSPY_BIN=$(Join-Path $root 'bin')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build flat package
        run: ./scripts/build.ps1 -BuildId ci-${{ matrix.host }} -HostRuntime ${{ matrix.host }} -DnSpyDir $env:CI_DNSPY_BIN
      - name: Test package and Windows PowerShell installer
        run: ./scripts/test-package.ps1 -PackageDir ./artifacts/build-ci-${{ matrix.host }} -DnSpyDir $env:CI_DNSPY_BIN
      - name: Upload tested package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mcp-package-${{ matrix.host }}
          path: artifacts/build-ci-${{ matrix.host }}/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: mcp-package-*
          path: release-packages
          merge-multiple: false
      
      - name: Extract release notes from package
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $changelogPath = './release-packages/mcp-package-net10/CHANGELOG.md'
          
          $changelog = Get-Content -LiteralPath $changelogPath -Raw -Encoding utf8
          $pattern = "(?ms)^##\s+\[?$([regex]::Escape($version))\]?[^\r\n]*\r?\n(.*?)(?=^##\s|\z)"
          if ($changelog -match $pattern) {
              $notes = $matches[1].Trim()
          } else {
              $notes = "dnSpy.MCP $env:GITHUB_REF_NAME"
          }
          Set-Content -LiteralPath './release-notes.md' -Value $notes -Encoding utf8

      - name: Create archives from the tested packages
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory release-assets | Out-Null
          foreach ($runtime in @('net10', 'net48')) {
              $folder = Join-Path './release-packages' "mcp-package-$runtime"
              $manifest = Get-Content (Join-Path $folder 'package.json') -Raw | ConvertFrom-Json
              if ($manifest.hostRuntime -ne $runtime -or $manifest.version -cne $env:GITHUB_REF_NAME.Substring(1)) {
                  throw 'Unexpected release artifact.'
              }
              foreach ($file in $manifest.files) {
                  if ($file.name -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$' -or $file.name -match '\.\.') {
                      throw 'Invalid filename.'
                  }
                  if ((Get-FileHash -LiteralPath (Join-Path $folder $file.name) -Algorithm SHA256).Hash -ine $file.sha256) {
                      throw 'Artifact checksum mismatch.'
                  }
              }
              $suffix = if ($runtime -eq 'net48') {
                  '-net48'
              } else {
                  ''
              }
              $archive = Join-Path './release-assets' "dnSpy-MCP-$env:GITHUB_REF_NAME$suffix-windows.zip"
              Compress-Archive -Path "$folder/*" -DestinationPath $archive
              $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
          }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem ./release-assets -File | ForEach-Object FullName)
          if ($assets.Count -ne 4) {
              throw 'Expected two ZIPs and two checksums.'
          }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "dnSpy.MCP $env:GITHUB_REF_NAME" --notes-file ./release-notes.md
          if ($LASTEXITCODE -ne 0) {
              throw 'Release creation failed.'
          }
